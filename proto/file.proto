syntax = "proto3";

package file;

option go_package = "./file";

service FileService {
  rpc SaveFile(FileRequest) returns (FileResponse);
  rpc GetFileList(FileListRequest) returns (FileListResponse);
}

message FileRequest {
  string filename = 1;
  string hash = 2;
  int64 size = 3;
  string upload_time = 4;
}

message FileResponse {
  bool success = 1;
  string message = 2;
  int64 file_id = 3;
}

message FileListRequest {
  int32 page = 1;
  int32 page_size = 2;
}

message FileRecord {
  int64 id = 1;
  string filename = 2;
  string hash = 3;
  int64 size = 4;
  string upload_time = 5;
}

message FileListResponse {
  bool success = 1;
  string message = 2;
  repeated FileRecord files = 3;
  int64 total = 4;
}
